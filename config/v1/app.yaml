version: v1

# -----------------------------------------------------------------------
# LLM
# llm_api_key is intentionally absent — supply via LLM_API_KEY env var
# or .env file. Never commit secrets to version-controlled YAML.
# Default model ID targets the local vLLM server. Override via the
# LLM_MODEL env var or .env file for other providers (e.g. claude-sonnet-4-6).
# -----------------------------------------------------------------------
llm_model: /model
llm_max_tokens: 1024

# -----------------------------------------------------------------------
# Memory (file system)
# -----------------------------------------------------------------------
memory_root: ./memory
index_path: ./memory/index.json

# -----------------------------------------------------------------------
# Redis (short-term session memory)
# -----------------------------------------------------------------------
redis_host: localhost
redis_port: 6379
redis_ttl: 3600
session_max_messages: 100

# -----------------------------------------------------------------------
# Session behaviour
# -----------------------------------------------------------------------
session_inactivity_timeout_seconds: 300
tool_timeout_seconds: 10
max_context_chars: 8000
max_tool_calls: 10

# -----------------------------------------------------------------------
# Logging  (overridden by config/v1/logging.yaml for log-specific detail)
# -----------------------------------------------------------------------
log_dir: ./logs
log_level: INFO

# -----------------------------------------------------------------------
# Dead-letter queue
# -----------------------------------------------------------------------
dlq_path: ./memory/dlq.jsonl
dlq_max_attempts: 3
dlq_retry_interval_seconds: 60
